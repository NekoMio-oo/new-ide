name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs on the same ref are pointless; keep the newest one only.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & component tests
        run: npm test

      - name: Build offline web bundle
        run: npm run build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: pocketforge-web-dist
          path: apps/mobile-ide/dist/
          if-no-files-found: error

  daemon:
    name: Native daemon (test + cross-compile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: native-daemon/go.sum

      - name: Check formatting
        working-directory: native-daemon
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        working-directory: native-daemon
        run: go vet ./...

      - name: Tests (real PTY + tar-slip guard + LSP reaping)
        working-directory: native-daemon
        run: go test -v ./...

      - name: Cross-compile Android daemon (arm64-v8a + x86_64)
        run: sh ./scripts/build-native-daemon.sh

      - name: Upload daemon binaries
        uses: actions/upload-artifact@v4
        with:
          name: libide-daemon-android
          path: |
            apps/mobile-ide/android/app/src/main/jniLibs/arm64-v8a/libide_daemon.so
            apps/mobile-ide/android/app/src/main/jniLibs/x86_64/libide_daemon.so
          if-no-files-found: error

  android-apk:
    name: Android APK (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [web, daemon]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build offline web bundle
        run: npm run build

      - name: Sync web assets into Capacitor Android host
        working-directory: apps/mobile-ide
        run: npx cap sync android

      - name: Inject freshly built daemon binaries
        uses: actions/download-artifact@v4
        with:
          name: libide-daemon-android
          path: apps/mobile-ide/android/app/src/main/jniLibs/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Caches ~/.gradle (AGP, Kotlin, androidx) so the APK step stops
      # re-downloading the whole toolchain on every run.
      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: apps/mobile-ide/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketforge-android-debug-apk
          path: apps/mobile-ide/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [web, daemon, android-apk]
    # Only tags publish; branch and PR runs stop at the artifacts above.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package offline web bundle
        run: |
          set -euo pipefail
          cd artifacts/pocketforge-web-dist
          zip -qr "$GITHUB_WORKSPACE/pocketforge-web-${{ github.ref_name }}.zip" .
          cd "$GITHUB_WORKSPACE"
          ls -lh pocketforge-web-${{ github.ref_name }}.zip

      - name: Verify artifacts are non-empty
        run: |
          set -euo pipefail
          test -n "$(find artifacts/pocketforge-android-debug-apk -name '*.apk' -size +1M -print -quit)"
          test -n "$(find artifacts/libide-daemon-android -name 'libide_daemon.so' -size +1M -print -quit)"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: PocketForge ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/pocketforge-android-debug-apk/*.apk
            artifacts/libide-daemon-android/arm64-v8a/libide_daemon.so
            artifacts/libide-daemon-android/x86_64/libide_daemon.so
            pocketforge-web-${{ github.ref_name }}.zip
